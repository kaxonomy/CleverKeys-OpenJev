name: CI

on:
  push:
    branches: [ main, develop, dev, 'dependency-validation/cleverkeys-*' ]
    tags-ignore:
      - '**'  # Tag validation is handled by release.yml
  pull_request:
    branches: [ main, develop ]

# Required for security scan SARIF upload
permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Tests and Validation
    runs-on: ubuntu-latest
    env:
      GRADLE_GUARD_XMX: 1536m
      GRADLE_GUARD_METASPACE: 512m

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: ''
        cmdline-tools-version: 15859902

    - name: Install compile SDK
      run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

    - name: Validate host privacy, locks and Android sources
      run: bash scripts/gradle-guard.sh verifyHostInferencePrivacy verifyDependencyLocks compileDebugAndroidTestKotlin compileReleaseKotlin --stacktrace

    - name: Run pure JVM tests
      run: bash scripts/gradle-guard.sh runPureTests --stacktrace

    - name: Run MockK tests
      run: bash scripts/gradle-guard.sh runMockTests --stacktrace

    - name: Upload resolved dependency locks
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: gradle-dependency-locks
        path: gradle.lockfile
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test-results
        path: |
          build/reports/tests/
          build/test-results/
        retention-days: 7

    - name: Run lint checks
      # Lint gate phase 1: abortOnError=true in build.gradle + baseline suppresses
      # pre-existing issues, so this fails only on NEW lint regressions.
      # NOTE: bare `lint` resolves to the DEFAULT variant, i.e. DEBUG. Release is linted
      # by the next step — do not assume this one covers it.
      run: bash scripts/gradle-guard.sh lintDebug --stacktrace

    - name: Run release lint checks
      # ARC-096: release is the ONLY minified variant and the one users install, and until
      # now NOTHING linted it — this job's `lint` is debug, and release.yml runs `lintDebug`.
      # Release-only issues (R8/shrinker-visible, `release` sourceSet, minify-dependent
      # manifest merges) were therefore invisible to every gate.
      # lintVitalRelease covers fatal release issues without packaging an APK.
      run: bash scripts/gradle-guard.sh lintVitalRelease --stacktrace

    - name: Verify validation produced no APKs or app bundles
      run: |
        test -z "$(find build -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
        git diff --exit-code -- gradle.lockfile debug.keystore debug.keystore.asc

    - name: Upload lint results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lint-results
        path: build/reports/lint-results*.xml
        retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    env:
      GRADLE_GUARD_XMX: 1536m
      GRADLE_GUARD_METASPACE: 512m

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Lint runs (as a hard gate) in the "Tests and Validation" job; not duplicated here.
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: ''
        cmdline-tools-version: 15859902

    - name: Install compile SDK
      run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

    - name: Dependency analysis
      run: bash scripts/gradle-guard.sh dependencies --stacktrace

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run security scan
      # SHA-pinned (= v0.36.0). Aqua deletes old version tags (0.28.0 was removed, which
      # failed this job at "Set up job"); a commit SHA can't be retagged away. To bump,
      # resolve a newer release tag to its commit SHA.
      #
      # BLOCKING (CK-150-023): this step used to carry `continue-on-error: true`, so the PR
      # path reported vulnerabilities and shipped anyway. The bar is now IDENTICAL to the
      # release `security-gate` in release.yml — same severity, same unfixed policy, same
      # exit-code — so nothing can pass here and fail at tag time (or vice versa). Keep the
      # two steps in sync when either changes.
      #
      # Accepted: unfixed upstream CVEs do not block the PR path; fixed HIGH/CRITICAL do.
      # Revisit alongside the release gate's identical note.
      # SPLIT (2026-08-29): trivy IGNORES --severity in SARIF mode — the SARIF always
      # carries every severity, and exit-code then fires on the unfiltered set, so this
      # step was red on unfixable MEDIUM/LOW findings the policy above explicitly accepts
      # (observed: 11 medium/low results, zero HIGH/CRITICAL, exit 1). The documented
      # pattern is two invocations: SARIF for code-scanning upload with no exit code,
      # then a table-format gate that honors the severity filter AND prints its findings
      # into the job log (the SARIF step never showed WHAT failed). release.yml's
      # security-gate is already table-format and needs no split.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    - name: Upload security results
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Gate on fixed HIGH/CRITICAL vulnerabilities
      # The BLOCKING half (CK-150-023): identical policy to release.yml's security-gate —
      # same severity, same unfixed policy, same exit-code. Keep the two in sync.
      # Table format = severity filter is honored AND findings print in this log.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        # Without this the action always exits 0 and the step would be decorative.
        exit-code: '1'
