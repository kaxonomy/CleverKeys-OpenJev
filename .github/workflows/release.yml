name: Tag Validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Tags run validation only; GitHub Actions never builds or publishes APKs.
  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_GUARD_XMX: 1536m
      GRADLE_GUARD_METASPACE: 512m
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Require tag commit on main
      run: |
        git fetch origin main --no-tags
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
          || { echo "::error::tag commit is not reachable from main"; exit 1; }

    # CK-150-035: this used to run in the final `release` job, after ~1h of gates. A tag that
    # does not match build.gradle is knowable in seconds, so it is checked here — first thing
    # after the checkout, before any toolchain setup.
    - name: Verify tag matches build.gradle version
      run: |
        TAG_VERSION=${GITHUB_REF_NAME#v}

        # Extract VERSION_MAJOR, VERSION_MINOR, VERSION_PATCH from build.gradle
        GRADLE_MAJOR=$(grep "VERSION_MAJOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_MINOR=$(grep "VERSION_MINOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_PATCH=$(grep "VERSION_PATCH" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_VERSION="${GRADLE_MAJOR}.${GRADLE_MINOR}.${GRADLE_PATCH}"

        echo "🏷️  Git Tag Version: $TAG_VERSION"
        echo "📦 Gradle Version:  $GRADLE_VERSION"

        if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
          echo "::error::VERSION MISMATCH! Git tag ($TAG_VERSION) does not match build.gradle ($GRADLE_VERSION)"
          echo "Please update VERSION_MAJOR/MINOR/PATCH in build.gradle to match the tag."
          exit 1
        fi

        echo "✅ Version match confirmed!"

    - name: Source hygiene preflight
      run: |
        test -z "$(git status --porcelain --untracked-files=all)"
        # CK-150-035: the range used to be hardcoded `v1.5.0..HEAD`, which silently widens
        # every release (at v1.7 it would re-check two releases' worth of commits). Derive
        # the previous tag instead, via `git describe --tags --abbrev=0` (the idiom the
        # changelog fallback uses below), with two necessary tightenings:
        #   - `HEAD^`, because HEAD *is* the release tag: describing from HEAD returns the
        #     tag being released, making the range empty and the check vacuous;
        #   - `--match 'v*'`, because the repo also carries non-release `dev-*` tags that
        #     would otherwise win and produce a meaningless range.
        # `fetch-depth: 0` above is what makes the tags available here; if it ever regresses
        # this fails loudly instead of degrading into a no-op.
        PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "::error::no previous v* tag reachable from HEAD^ — cannot derive the whitespace-check range (is the checkout missing tags?)"
          exit 1
        fi
        echo "Whitespace check over $PREV_TAG..HEAD"
        git diff --check "$PREV_TAG..HEAD"

    - name: Setup Java 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    # runMockTests resolves android.jar from platforms/android-37.2 for the stubs.
    - name: Install pinned SDK components
      run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Validate host privacy and dependency locks
      run: bash scripts/gradle-guard.sh verifyHostInferencePrivacy verifyDependencyLocks --stacktrace

    - name: Run pure JVM tests
      run: bash scripts/gradle-guard.sh runPureTests --stacktrace

    - name: Run MockK tests
      timeout-minutes: 20
      run: bash scripts/gradle-guard.sh runMockTests --stacktrace

    - name: Run Android lint and compile instrumented tests
      run: bash scripts/gradle-guard.sh lintDebug lintVitalRelease compileDebugAndroidTestKotlin compileReleaseKotlin --stacktrace

    - name: Verify validation produced no APKs or app bundles
      run: |
        test -z "$(find build -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
        git diff --exit-code -- gradle.lockfile debug.keystore debug.keystore.asc

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - name: Run web-demo parity and smoke tests
      working-directory: web_demo/tests
      run: |
        bun install --frozen-lockfile
        bun run ctc-app-parity
        bun run ctc-app-smoke
        bun run f-regression

    - name: Verify demo model matches Android asset
      run: cmp web_demo/ctc_swipe_encoder.onnx src/main/assets/models/ctc_swipe_encoder.onnx

  security-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Block high/critical repository vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: table
        severity: HIGH,CRITICAL
        # Accepted: unfixed upstream CVEs do not block release; fixed HIGH/CRITICAL do.
        # Revisit each release.
        ignore-unfixed: true
        exit-code: '1'
